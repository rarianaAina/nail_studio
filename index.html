<!-- index.html -->
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/icone-192.png" />
    <!-- iOS ignore le manifeste pour l'icône d'écran d'accueil. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Harrys Studio" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ✅ CSS Critique inline (visible immédiatement) -->
    <style>
      /* ===== CRITICAL CSS ===== */
      :root {
        --background: 40 25% 97%;
        --foreground: 30 20% 15%;
        --primary: 30 60% 45%;
        --primary-foreground: 40 25% 97%;
        --accent: 35 55% 48%;
        --border: 35 15% 85%;
        --muted: 35 15% 88%;
      }

      * {
        border-color: hsl(var(--border));
      }

      body {
        margin: 0;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4, .font-display {
        font-family: 'Cormorant Garamond', Georgia, serif;
      }

      .gradient-rose {
        background-image: linear-gradient(
          135deg,
          hsl(35 25% 92%) 0%,
          hsl(30 20% 88%) 50%,
          hsl(35 30% 85%) 100%
        );
      }

      .bg-grid {
        background-image: radial-gradient(
          circle at 1px 1px,
          rgba(200, 180, 160, 0.6) 1px,
          transparent 0
        );
        background-size: 24px 24px;
      }

      .text-balance {
        text-wrap: balance;
      }

      /* Scrollbar (visible immédiatement) */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: hsl(var(--muted));
      }
      ::-webkit-scrollbar-thumb {
        background: hsl(30 40% 60%);
        border-radius: 999px;
        border: 2px solid hsl(var(--muted));
      }
      ::-webkit-scrollbar-thumb:hover {
        background: hsl(30 50% 45%);
      }
    </style>
    
    <!-- ✅ Preconnect (3 seulement : Google Fonts + Supabase) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://tzgcyehdjgqxljjttflj.supabase.co" />

    <!-- Image la plus grande de l'accueil. Sans ce préchargement, le navigateur
         ne la découvre qu'après avoir exécuté le JavaScript et rendu le
         composant : le LCP attend toute la chaîne. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://tzgcyehdjgqxljjttflj.supabase.co/storage/v1/object/public/images/services/1785598830482-uymrlg1.webp"
    />
    
    <!-- ✅ Chargement non bloquant des polices -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
    
    <!-- La feuille de style principale est injectée par Vite sous un nom
         haché. Ne pas la référencer à la main ici : un chemin fixe ne pointe
         sur rien et la réécriture SPA renvoie alors index.html. -->

    <!-- Socle de données structurées, présent dès le HTML : Google indexe en
         deux temps et le rendu JavaScript peut tarder de plusieurs jours. Le
         composant StructuredData réécrit ce même bloc — identifiant identique —
         dès que les paramètres du salon sont chargés, pour y ajouter adresse,
         horaires, réseaux sociaux et note moyenne. -->
    <script type="application/ld+json" id="donnees-structurees-salon">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Harrys Studio",
        "description": "Salon d'onglerie : pose de gel, semi-permanent, manucure et nail art.",
        "priceRange": "€€",
        "currenciesAccepted": "EUR",
        "address": { "@type": "PostalAddress", "addressCountry": "FR" }
      }
    </script>

    <title data-default>Harrys Studio — Salon d'onglerie</title>
    <meta
      name="description"
      content="Salon d'onglerie : pose de gel, semi-permanent, manucure, beauté des pieds et nail art. Réservez votre rendez-vous en ligne."
    />

    <!-- Valeurs de partage par défaut. Les robots des réseaux sociaux
         n'exécutent pas le JavaScript : contrairement à Google, ils ne voient
         jamais les balises posées par le composant Seo. Celles-ci leur servent
         de repli. -->
    <meta property="og:site_name" content="Harrys Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harrys Studio — Salon d'onglerie" />
    <meta
      property="og:description"
      content="Pose de gel, semi-permanent, manucure et nail art. Réservation en ligne."
    />
    <meta
      property="og:image"
      content="https://tzgcyehdjgqxljjttflj.supabase.co/storage/v1/object/public/images/logos/logo.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#b9834d" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
